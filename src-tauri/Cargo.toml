[package]
name = "dentiva-pro"
version = "1.0.0"
description = "Dentiva Pro — offline dental clinic management (Tauri 2 + SQLite)"
authors = ["Shohan Khan <helloiamshohan@gmail.com>"]
edition = "2021"

[lib]
name = "dentiva_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[features]
default = []
