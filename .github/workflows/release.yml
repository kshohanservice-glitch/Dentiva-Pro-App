# Dentiva Pro — Windows installer release.
# Trigger: version tag push (v1.0.0, ...) or manual dispatch.
# Produces: NSIS .exe installer (+ portable .exe) attached to the GitHub Release
# and uploaded as workflow artifacts. A local fallback copy belongs in /dist
# (see dist/README.md). Set the DENTIVA_PRODUCT_CODE repository secret to run
# the genuine-code activation acceptance test in CI.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit:secrets
      - run: npm run audit:todo
      # TEMPORARY debug: re-run audits and surface output as annotations
      # (Windows failure diagnosis; remove once root-caused).
      - name: Debug audit outputs
        if: failure()
        shell: pwsh
        run: |
          foreach ($s in @('audit:secrets','audit:todo')) {
            $lines = npm run $s 2>&1 | Select-Object -First 12
            if ($LASTEXITCODE -ne 0) {
              Write-Output "::error::${s} FAILED on rerun"
              foreach ($l in $lines) {
                $t = ("" + $l).Trim() -replace '%','%25'
                if ($t.Length -gt 300) { $t = $t.Substring(0,300) }
                Write-Output "::error::  $t"
              }
            } else {
              Write-Output "::notice::${s} passed on rerun"
            }
          }
      - name: Tests (incl. genuine-code activation acceptance when the secret is set)
        env:
          DENTIVA_PRODUCT_CODE: ${{ secrets.DENTIVA_PRODUCT_CODE }}
        run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --release
      - name: Build Tauri app (NSIS installer + portable exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dentiva-pro-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
