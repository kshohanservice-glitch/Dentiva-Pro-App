# Dentiva Pro — Windows installer release.
# Trigger: version tag push (v1.0.0, ...) or manual dispatch.
# Produces: NSIS .exe installer (+ portable .exe) attached to the GitHub Release
# and uploaded as workflow artifacts. A local fallback copy belongs in /dist
# (see dist/README.md). Set the DENTIVA_PRODUCT_CODE repository secret to run
# the genuine-code activation acceptance test in CI.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit:secrets
      - run: npm run audit:todo
      - name: Tests (incl. genuine-code activation acceptance when the secret is set)
        env:
          DENTIVA_PRODUCT_CODE: ${{ secrets.DENTIVA_PRODUCT_CODE }}
        run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --release
      - name: Build Tauri app (NSIS installer + portable exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dentiva-pro-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
      - name: Create GitHub Release with installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Dentiva Pro** — offline-first dental clinic management for Windows (Tauri 2 + SQLite).

            No internet required: activation, setup, backup/restore, and printing all work fully offline. Currency BDT (৳) with Bengali Unicode support.

            Install `Dentiva Pro_*_x64-setup.exe`, launch, and enter the one-time product activation code at first run. See `docs/RELEASE_CHECKLIST.md` for the acceptance procedure.
