# Dentiva Pro — continuous integration (every push / PR).
# Gates: types, lint, unit+integration tests, security audits, web build, Rust checks.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit:licenses
      - run: npm run audit:secrets
      - run: npm run audit:todo
      - run: npm run build

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo fmt (auto-fix + push)
        id: fmt
        working-directory: src-tauri
        run: |
          cargo fmt
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push formatting fixes
        if: steps.fmt.outputs.dirty == 'true'
        run: |
          git config user.name "dentiva-fmt-bot"
          git config user.email "dentiva-fmt-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: cargo fmt (automated)" && git push
      - name: Fail if code was unformatted
        if: steps.fmt.outputs.dirty == 'true'
        run: |
          echo "::error::Rust sources were not rustfmt-clean; an automated fix was pushed to the branch."
          exit 1
      - name: cargo clippy
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee "$GITHUB_WORKSPACE/rust-clippy.log"
      - name: cargo test
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test 2>&1 | tee "$GITHUB_WORKSPACE/rust-test.log"
      - name: cargo check
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo check 2>&1 | tee "$GITHUB_WORKSPACE/rust-check.log"
      - name: Upload Rust logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rust-logs
          path: rust-*.log
          if-no-files-found: ignore
      - name: Report Rust log tails as annotations
        if: failure()
        run: |
          for f in rust-clippy.log rust-test.log rust-check.log; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              grep -aE "^(error|warning)" "$GITHUB_WORKSPACE/$f" | head -30 | sed 's/%/%25/g' | while IFS= read -r line; do
                echo "::error::$f: $line"
              done
            fi
          done
